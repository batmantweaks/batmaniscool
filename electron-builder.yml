appId: com.batmaniscool.utility
productName: batmaniscool
directories:
  output: dist/installer-v4.7
files:
  - "**/*"
  - "!dist/**"
  - "!qa-output/**"
  - "!tests/**"
  - "!RELEASE-*.md"
  - "!UPDATE_AND_SIGNING.md"
win:
  icon: assets/app-icon.png
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
artifactName: "${productName}-${version}-setup.${ext}"
publish:
  provider: github
  owner: batmantweaks
  repo: batmaniscool
